services:
  leaderboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - internal

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - internal

networks:
  internal:
